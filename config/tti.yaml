/**:
  ros__parameters:

    # The Hugging Face repo id to use
    # black-forest-labs/flux-3-image-klein       (step-distilled, Kommunity License, 16 steps, no CFG)
    # black-forest-labs/flux-3-image-klein-base  (base model, Kommunity License, 50 steps, CFG)
    repo_id: "black-forest-labs/flux-3-image-klein"

    # Directory to cache Hugging Face models
    model_dir: "./models"

    # The torch device to use (e.g., "cuda:0" or "cpu")
    device: "cuda:0"

    # --- Initial Prompt ---

    # An initial prompt to generate an image at startup.
    # Supports plain text OR JSON: {"content": "...", "image_url": "..."}
    # FLUX.3 takes full scene captions; short prompts produce generic output.
    prompt: "A robot face close up which has a small daisy flower in its mouth on the left side, cinematic lighting, 8k resolution"

    # --- Dynamic Parameters (Adjustable via RQT) ---

    # If true, keeps the model in memory between prompts (faster)
    keep_loaded: false

    # If true, uses automatic component CPU offloading (ComponentsManager) to save VRAM.
    # Set to false for maximum speed on high-end GPUs (bf16 needs ~21GB VRAM at 1024x1024)
    cpu_offload: true

    # If true, runs the bundled prompt upsampler (9B "pup" model, ~19GB extra
    # download) to expand short requests into full scene captions before generation.
    use_prompt_upsampler: false

    # Number of denoising steps (distilled checkpoint: 4-16, default 16; base: 50)
    num_inference_steps: 16

    # Classifier-free guidance strength. Only applied by checkpoints with a guider
    # component (base model, default 3.5); ignored by the step-distilled model
    guidance_scale: 3.5

    # Number of images to generate per prompt request
    num_images_per_prompt: 1

    # The frame_id for the generated image messages
    frame_id: "flux3k"

    # --- Output & Control ---

    # Path/URL to an input image to condition the generation (leave empty for text-to-image)
    input_image: ""

    # If true, the node will exit after generating the first image
    once: false

    # Path for saving output images. Use a path ending in "auto" for unique filenames
    image_path: "generated_images/auto"

    # Seed for the random number generator. Use -1 for a random seed on each run
    seed: -1

    # Starting value for the autogenerated image filename counter
    image_counter_start: 1

    # Dimensions of the generated image
    height: 1024
    width: 1024
